; mdfw.ini - MD/JS built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/JS
output = build/md-js.mdfw
; The firmware's own main() runs, with EmuMD standing in for the
; template's hardware (romemul.c, hw_config.c, sdcard.c are left out) and
; the Booster. The version and app UUID come from version.txt and uuid.txt.
template = sidecartridge

[sources]
; As rp/src/CMakeLists.txt lists them, and JerryScript's core.
files =
    rp/src/*.c
    rp/src/settings/settings.c
    rp/src/httpc/httpc.c
    lib/jerryscript/jerry-core/**/*.c

[compile]
include =
    rp/src                    ; lwipopts.h
    rp/src/include
    rp/src/settings
    rp
    lib/jerryscript/jerry-core/include
    lib/jerryscript/jerry-core
    lib/jerryscript/jerry-core/api
    lib/jerryscript/jerry-core/debugger
    lib/jerryscript/jerry-core/ecma/base
    lib/jerryscript/jerry-core/ecma/builtin-objects
    lib/jerryscript/jerry-core/ecma/builtin-objects/typedarray
    lib/jerryscript/jerry-core/ecma/operations
    lib/jerryscript/jerry-core/jcontext
    lib/jerryscript/jerry-core/jmem
    lib/jerryscript/jerry-core/jrt
    lib/jerryscript/jerry-core/lit
    lib/jerryscript/jerry-core/parser/js
    lib/jerryscript/jerry-core/parser/regexp
    lib/jerryscript/jerry-core/vm
; rp/src/CMakeLists.txt's, and what its JerryScript settings come to.
defines =
    MDJS_NO_NETWORK=0
    APP_DOWNLOAD_HTTPS=0
    JERRY_NDEBUG
    JERRY_GLOBAL_HEAP_SIZE=32
    JERRY_EXTERNAL_CONTEXT=1
    JERRY_PARSER=1
    JERRY_CPOINTER_32_BIT=0
    JERRY_DEBUGGER=0
    JERRY_ERROR_MESSAGES=0
    JERRY_FUNCTION_TO_STRING=0
    JERRY_LINE_INFO=0
    JERRY_LOGGING=0
    JERRY_MEM_STATS=0
    JERRY_MEM_GC_BEFORE_EACH_ALLOC=0
    JERRY_PARSER_DUMP_BYTE_CODE=0
    JERRY_PROMISE_CALLBACK=0
    JERRY_REGEXP_STRICT_MODE=0
    JERRY_REGEXP_DUMP_BYTE_CODE=0
    JERRY_SNAPSHOT_EXEC=0
    JERRY_SNAPSHOT_SAVE=0
    JERRY_SYSTEM_ALLOCATOR=0
    JERRY_VALGRIND=0
    JERRY_VM_HALT=0
    JERRY_VM_THROW=0
    JERRY_GC_LIMIT=(0)
    JERRY_STACK_LIMIT=(0)
    JERRY_GC_MARK_LIMIT=(8)
cflags = -O2

[wifi]
; The Pico SDK's lwIP, and the HTTP client fetch() uses.
lwip = pico-sdk/lib/lwip
apps = http/http_client.c

[run]
machine = ste
